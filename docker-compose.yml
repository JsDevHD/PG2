# Levanta el sistema completo: frontend, API Gateway, los cuatro microservicios, MongoDB y Azurite.
#
#   docker compose up --build
#
# Puertos en el host: 3000 frontend, 8080 gateway (único punto de entrada del frontend),
# 8001 auth, 8002 projects, 8003 feedback, 8004 export, 27017 mongo, 10000 azurite. Dentro de la red de compose cada servicio escucha en el 8000 y se alcanza por
# su nombre (p. ej. http://auth-service:8000), que es el default de AUTH_SERVICE_URL.
#
# JWT_SECRET_KEY se toma de un `.env` en la raíz (opcional); debe ser idéntica en los cuatro.
# Los `.env` de cada servicio también se cargan si existen, pero los valores de `environment`
# de aquí tienen prioridad.

x-common-env: &common-env
  ENVIRONMENT: development
  MONGODB_URI: mongodb://mongo:27017
  MONGODB_DB_NAME: graphic_tracker
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  JWT_ALGORITHM: HS256
  JWT_EXPIRE_MINUTES: 60
  # 5173 = `pnpm dev` del frontend; 3000 = contenedor del frontend.
  CORS_ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
  LOG_LEVEL: INFO

# Cuenta de desarrollo pública de Azurite (emulador de Blob Storage), alcanzada por la red de compose.
x-azurite-conn: &azurite-conn "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"

services:
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      # Se leen al arrancar el contenedor (no al construir). Vacío = mismo origen: el navegador
      # llama a /api/ de :3000 y este Nginx lo reenvía al gateway, así basta exponer el puerto
      # 3000 (p. ej. con el reenvío de puertos de VS Code). En Azure: la URL de API Management.
      API_GATEWAY_URL: ""
      API_PROXY_UPSTREAM: http://gateway:8080
    depends_on: [gateway]

  # Gateway local; en Azure lo reemplaza API Management (ver gateway/README.md).
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [auth-service, projects-service, feedback-service, export-service]

  auth-service:
    build: ./Auth_Service
    ports: ["8001:8000"]
    env_file:
      - path: ./Auth_Service/.env
        required: false
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
    depends_on: [mongo]

  projects-service:
    build: ./Projects_Service
    ports: ["8002:8000"]
    env_file:
      - path: ./Projects_Service/.env
        required: false
    environment:
      <<: *common-env
      SERVICE_NAME: projects-service
      AZURE_STORAGE_CONNECTION_STRING: *azurite-conn
      AZURE_STORAGE_CONTAINER: versions
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on: [mongo, azurite, auth-service]

  feedback-service:
    build: ./Feedback_Service
    ports: ["8003:8000"]
    env_file:
      - path: ./Feedback_Service/.env
        required: false
    environment:
      <<: *common-env
      SERVICE_NAME: feedback-service
    depends_on: [mongo]

  export-service:
    build: ./Export_Service
    ports: ["8004:8000"]
    env_file:
      - path: ./Export_Service/.env
        required: false
    environment:
      <<: *common-env
      SERVICE_NAME: export-service
      AZURE_STORAGE_CONNECTION_STRING: *azurite-conn
      AZURE_STORAGE_CONTAINER: versions
      AUTH_SERVICE_URL: http://auth-service:8000
    depends_on: [mongo, azurite, auth-service]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck
    ports: ["10000:10000"]

volumes:
  mongo_data:
