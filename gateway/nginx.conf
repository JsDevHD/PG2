# API Gateway LOCAL (reemplaza a Azure API Management mientras se desarrolla en local).
#
# El frontend solo conoce esta URL (VITE_API_GATEWAY_URL=http://localhost:8080). La tabla de
# enrutamiento es la de la sección 8 de frontend/06_Frontend_Especificacion.md; si cambia aquí,
# debe cambiar igual en Azure (ver gateway/README.md).
#
# CORS NO se maneja aquí: lo resuelve cada microservicio con CORS_ALLOWED_ORIGINS y Nginx solo
# reenvía sus cabeceras. Agregar CORS también en el gateway duplicaría Access-Control-Allow-Origin.

server {
    listen 8080;

    # DNS interno de Docker, resuelto en cada petición (valid=10s): si un servicio se recrea y
    # cambia de IP, el gateway lo sigue encontrando sin reiniciarse. Con proxy_pass a una variable
    # sin URI, Nginx reenvía la ruta original completa (/api/v1/...).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_service     auth-service:8000;
    set $projects_service projects-service:8000;
    set $feedback_service feedback-service:8000;
    set $export_service   export-service:8000;

    # Subidas de versiones: Projects acepta hasta MAX_FILE_SIZE_MB (20 MB) + campos del formulario.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Export genera el PDF descargando imágenes de Blob; puede tardar más que una petición normal.
    proxy_read_timeout 120s;

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok", "service": "api-gateway"}';
    }

    # ---- Auth Service ----
    location /api/v1/auth/  { proxy_pass http://$auth_service; }
    location /api/v1/users/ { proxy_pass http://$auth_service; }

    # ---- Projects Service ----
    # /api/v1/courses (crear/listar), /join, /{id}/projects y /{id}/progress.
    location /api/v1/courses { proxy_pass http://$projects_service; }
    location ~ ^/api/v1/projects/[^/]+/versions(/.*)?$ { proxy_pass http://$projects_service; }
    # Editar (PATCH) o eliminar (DELETE) un proyecto.
    location ~ ^/api/v1/projects/[^/]+$ { proxy_pass http://$projects_service; }
    # Grupos de los proyectos por grupos y el plazo para formarlos.
    location ~ ^/api/v1/projects/[^/]+/(groups(/.*)?|group-deadline)$ { proxy_pass http://$projects_service; }

    # ---- Feedback Service ----
    location ~ ^/api/v1/versions/[^/]+/feedback$ { proxy_pass http://$feedback_service; }
    location ~ ^/api/v1/projects/[^/]+/(feedback|final-grade)$ { proxy_pass http://$feedback_service; }

    # ---- Export Service ----
    location ~ ^/api/v1/projects/[^/]+/export$ { proxy_pass http://$export_service; }
    # Portafolio académico del estudiante (varios cursos y proyectos en un PDF).
    location /api/v1/portfolio/ { proxy_pass http://$export_service; }

    # Cualquier otra ruta no existe en el contrato: mismo formato de error que los servicios.
    location / {
        default_type application/json;
        return 404 '{"detail": "Ruta no encontrada en el API Gateway"}';
    }
}
