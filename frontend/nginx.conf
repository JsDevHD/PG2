# Plantilla: la imagen oficial de Nginx la procesa con envsubst al arrancar
# (/etc/nginx/templates → /etc/nginx/conf.d). ${API_GATEWAY_URL} es la URL del gateway que usa el
# navegador (vacía = mismo origen) y ${API_PROXY_UPSTREAM} adónde se reenvía /api/ en ese caso.
server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/css application/javascript;

    # CSP: el JS solo puede conectarse al propio origen y al gateway; las vistas previas (blob:)
    # solo como imagen o iframe de PDF; ningún plugin ni script externo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' ${API_GATEWAY_URL}; frame-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Mismo origen: /api/ se reenvía al gateway (un solo puerto expuesto, sin CORS). Se resuelve en
    # cada petición, así Nginx arranca aunque el gateway no exista (p. ej. en Azure con APIM).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream "${API_PROXY_UPSTREAM}";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;  # versiones de hasta 20 MB
        proxy_read_timeout 120s;   # exportación de PDF
    }

    # Los assets llevan hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Configuración del entorno, generada al arrancar: nunca en caché.
    location = /config.js {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # index.html no se cachea, para que un despliegue nuevo se vea de inmediato.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' ${API_GATEWAY_URL}; frame-src blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
