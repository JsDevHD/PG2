services:
  service:
    build: .
    ports: ["8004:8000"]  # host: 8001 auth, 8002 projects, 8003 feedback, 8004 export
    env_file: .env
    environment:
      # Dentro de la red de compose Mongo se alcanza por el nombre del servicio, no por localhost.
      MONGODB_URI: mongodb://mongo:27017
    depends_on: [mongo]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
volumes:
  mongo_data:
